<!doctype html>
<html lang="pt-BR" data-cor="verde" data-modo="escuro" data-tamanho="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141D19">
<meta name="description" content="Planos de aula da educação infantil ao ensino médio, com anotações, check-lists, lembretes e agenda. Funciona sem internet.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planejar">
<meta name="author" content="Alan Correa">
<meta property="og:title" content="Planejar — Planejamento escolar">
<meta property="og:description" content="Planos de aula da educação infantil ao ensino médio. Ficha pronta em PDF ou imagem.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">
<title>Planejar — Planejamento escolar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== paleta: 6 cores, aplicadas em qualquer modelo ===== */
html{--acRGB:122,86,214}
html[data-cor=lilas]{--acRGB:122,86,214;--ac-forte:#5B3BB0;--barra:#7A56D6}
html[data-cor=rosa]{--acRGB:206,74,120;--ac-forte:#A93560;--barra:#CE4A78}
html[data-cor=azul]{--acRGB:47,106,196;--ac-forte:#26518F;--barra:#2F6AC4}
html[data-cor=verde]{--acRGB:38,146,98;--ac-forte:#1D6C48;--barra:#269262}
html[data-cor=ambar]{--acRGB:198,124,32;--ac-forte:#94591A;--barra:#C67C20}
html[data-cor=petroleo]{--acRGB:33,120,134;--ac-forte:#175A64;--barra:#217886}
html{--ac:rgb(var(--acRGB));--ac2:rgba(var(--acRGB),.12);--ac-ink:#fff}
html[data-modo=escuro]{--ac:color-mix(in srgb, rgb(var(--acRGB)) 74%, #ffffff);--ac2:rgba(var(--acRGB),.24);--ac-forte:var(--ac);--ac-ink:#12101a}

/* ===== base estrutural (compartilhada pelos 3 modelos) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html[data-tamanho="grande"]{font-size:17.5px}
html[data-tamanho="maior"]{font-size:19.5px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);
  font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.travado{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:700;line-height:1.15}
p{margin:0}
:focus-visible{outline:2.5px solid var(--ac);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- casca ---- */
.app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.topo{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--topo-bg);color:var(--topo-ink);border-bottom:var(--topo-borda)}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca-ico{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--r-ico);
  background:var(--marca-bg);color:var(--marca-ink);font-family:var(--fd);font-size:.9rem;font-weight:700;flex:none}
.marca-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.marca-txt b{font-family:var(--fd);font-size:1.06rem;letter-spacing:var(--ls-marca)}
.marca-txt small{font-size:.68rem;opacity:.7;font-family:var(--fu);letter-spacing:.08em;text-transform:uppercase}
.topo-acoes{display:flex;gap:4px}
.ico{display:grid;place-items:center;width:38px;height:38px;border-radius:var(--r-ico);color:inherit}
.ico svg{width:21px;height:21px}
.ico:hover{background:var(--hover)}
.ico.mini{width:28px;height:28px;opacity:.5}
.ico.mini svg{width:15px;height:15px}

.escopo{position:sticky;top:var(--topo-h);z-index:29;display:flex;gap:8px;padding:10px 16px;background:var(--escopo-bg);border-bottom:var(--escopo-borda)}
.escopo-btn{flex:1;min-width:0;text-align:left;padding:7px 12px;border-radius:var(--r2);background:var(--surf);border:var(--borda);display:flex;flex-direction:column;gap:1px}
.escopo-btn .rot{font-family:var(--fu);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;opacity:.55}
.escopo-btn .val{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.vista{flex:1;padding:18px 16px 28px;max-width:760px;width:100%;margin:0 auto}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--nav-bg);border-top:var(--nav-borda);backdrop-filter:blur(10px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--nav-ink);opacity:.55;font-family:var(--fu);font-size:.6rem;letter-spacing:.02em}
.nav button svg{width:22px;height:22px}
.nav button.on{opacity:1;color:var(--ac)}

/* ---- textos e cabeçalhos ---- */
.eyebrow{font-family:var(--fu);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.saudacao{margin-bottom:20px}
.saudacao h1{font-size:1.8rem;margin:4px 0 6px}
.saudacao .sub{font-size:.92rem;opacity:.75}
.cabeca{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.cabeca h1{font-size:1.55rem}
.grupo{font-family:var(--fu);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin:22px 0 8px}
.secao{margin-top:26px}
.secao-topo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.secao-topo h2{font-size:1.1rem}
.link{color:var(--ac);font-size:.82rem;font-weight:600}
.meta{font-family:var(--fu);font-size:.75rem;opacity:.6}
.meta.alerta{color:var(--perigo);opacity:1;font-weight:600}
.dica{font-size:.8rem;opacity:.6;margin-top:6px}
.credito{margin-top:24px;text-align:center;font-size:.72rem;opacity:.45;font-family:var(--fu)}

/* ---- botões ---- */
.btn{padding:11px 18px;border-radius:var(--r2);background:var(--ac);color:var(--ac-ink);font-weight:600;font-size:.9rem;
  box-shadow:var(--btn-sombra);transition:transform .12s ease,filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surf);color:var(--ink);border:var(--borda);box-shadow:none}
.btn.perigo,.btn.ghost.perigo{color:var(--perigo)}
.btn.perigo{background:var(--perigo);color:#fff}
.btn.ghost.perigo{background:var(--surf)}
.btn.mini{padding:7px 13px;font-size:.8rem}
.chip{padding:7px 13px;border-radius:999px;background:var(--surf2);border:var(--borda);font-size:.8rem;font-family:var(--fu)}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.linha-acoes{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips-sel{display:flex;gap:8px;flex-wrap:wrap}
.chip.sel{text-align:left}

/* ---- KPI ---- */
.grade-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{padding:12px 8px;border-radius:var(--r);background:var(--surf);border:var(--borda);text-align:center;box-shadow:var(--sombra)}
.kpi b{display:block;font-family:var(--fd);font-size:1.5rem;color:var(--ac);line-height:1}
.kpi span{display:block;margin-top:4px;font-size:.66rem;opacity:.6;font-family:var(--fu);line-height:1.25}
@media (max-width:400px){.grade-kpi{grid-template-columns:repeat(2,1fr)}}

/* ---- tira da semana ---- */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{padding:9px 2px 7px;border-radius:var(--r2);background:var(--surf);border:var(--borda);display:flex;flex-direction:column;align-items:center;gap:2px}
.dia .ds{font-family:var(--fu);font-size:.6rem;opacity:.5;text-transform:uppercase}
.dia .dn{font-family:var(--fd);font-size:1.02rem;font-weight:700}
.dia .pontos{display:flex;gap:2px;height:5px}
.dia .pontos i{width:4px;height:4px;border-radius:50%;background:var(--ac)}
.dia.hoje{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.dia.cheio{background:var(--ac2)}

/* ---- cartões ---- */
.cartao.lista:hover{transform:none;box-shadow:var(--sombra)}
.cartao{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r);background:var(--surf);
  border:var(--borda);box-shadow:var(--sombra);margin-bottom:9px;text-align:left;width:100%;cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease}
.cartao:hover{transform:translateY(-1px);box-shadow:var(--sombra-alta)}
.cartao-txt{flex:1;min-width:0}
.cartao h3{font-size:.98rem;font-family:var(--ff);font-weight:650;margin-bottom:2px}
.cartao .trecho{font-size:.82rem;opacity:.6;margin-top:3px}
.data-bloco{flex:none;width:44px;text-align:center;padding:5px 0;border-radius:var(--r2);background:var(--ac2);color:var(--ac-forte)}
.data-bloco b{display:block;font-family:var(--fd);font-size:1.18rem;line-height:1}
.data-bloco span{font-family:var(--fu);font-size:.6rem;text-transform:uppercase;opacity:.75}
.selo{flex:none;font-family:var(--fu);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;
  padding:3px 8px;border-radius:999px;background:var(--surf2);opacity:.7}
.selo.ok{background:var(--ac2);color:var(--ac-forte);opacity:1}
.marcador{flex:none}
.cartao .marcador{width:26px;height:26px;border-radius:50%;border:2px solid var(--linha-forte);display:grid;place-items:center;
  font-size:.8rem;color:var(--ac);background:transparent}
.cartao.feito{opacity:.5}
.cartao.feito .marcador{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}

.vazio{padding:26px 18px;border-radius:var(--r);background:var(--surf2);border:var(--borda-tracejada);text-align:center}
.vazio h3{font-size:1.05rem;margin-bottom:6px}
.vazio p{font-size:.86rem;opacity:.65;margin-bottom:14px}
.vazio.compacto{padding:16px}
.vazio.compacto p{margin-bottom:8px}
.atalhos{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.atalho{padding:14px;border-radius:var(--r);background:var(--surf);border:var(--borda);text-align:left;box-shadow:var(--sombra)}
.atalho b{display:block;font-size:.92rem}
.atalho span{font-size:.74rem;opacity:.55;font-family:var(--fu)}
.aviso{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--r);
  background:var(--ac2);color:var(--ac-forte);margin-bottom:14px}
.aviso p{font-size:.84rem}

/* ---- busca ---- */
.busca{margin-bottom:12px}
.busca input{width:100%;padding:11px 14px;border-radius:var(--r2);border:var(--borda);background:var(--surf);font-size:.9rem}

/* ---- listas ---- */
.lista{display:block;cursor:default}
.lista-topo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lista-topo h3{flex:1;font-size:1rem}
.prog{width:56px;height:5px;border-radius:99px;background:var(--surf2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);transition:width .25s}
.pc{font-family:var(--fu);font-size:.7rem;opacity:.55}
.itens{list-style:none;margin:0;padding:0}
.itens li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:var(--borda-fina)}
.itens li span{flex:1;font-size:.9rem}
.itens li.feito span{text-decoration:line-through;opacity:.45}
.itens .marcador{width:22px;height:22px;border-radius:6px;border:2px solid var(--linha-forte);display:grid;place-items:center;font-size:.75rem;color:var(--ac)}
.itens li.feito .marcador{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.add-item{display:flex;gap:8px;margin-top:10px}
.add-item input{flex:1;padding:8px 12px;border-radius:var(--r2);border:var(--borda);background:var(--surf2);font-size:.86rem}

/* ---- agenda ---- */
.mes-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mes-topo h2{font-size:1.12rem}
.calendario{border-radius:var(--r);background:var(--surf);border:var(--borda);padding:10px;box-shadow:var(--sombra)}
.cal-cab{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.cal-cab span{text-align:center;font-family:var(--fu);font-size:.62rem;text-transform:uppercase;opacity:.45}
.cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cel{aspect-ratio:1;border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.86rem}
.cel .n{font-family:var(--fd);font-weight:600}
.cel .pontos{display:flex;gap:2px;height:5px}
.cel .pontos i{width:4px;height:4px;border-radius:50%}
.cel i.p1{background:var(--ac)}
.cel i.p2{background:var(--perigo)}
.cel i.p3{background:var(--ok)}
.cel:hover{background:var(--surf2)}
.cel.hoje{color:var(--ac);font-weight:800}
.cel.sel{background:var(--ac);color:var(--ac-ink)}
.cel.sel i{background:var(--ac-ink)!important}
.cel.fora{visibility:hidden}
.legenda{display:flex;gap:14px;justify-content:center;margin-top:10px;font-family:var(--fu);font-size:.7rem;opacity:.6}
.legenda span{display:flex;align-items:center;gap:5px}
.legenda i{width:6px;height:6px;border-radius:50%;display:inline-block}
.legenda i.p1{background:var(--ac)}.legenda i.p2{background:var(--perigo)}.legenda i.p3{background:var(--ok)}

/* ---- folha (modal) ---- */
.folha{position:fixed;inset:0;z-index:60;background:rgba(20,16,30,.45);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center}
.folha.open{display:flex}
.folha-card{width:100%;max-width:640px;max-height:94vh;display:flex;flex-direction:column;
  background:var(--bg);border-radius:var(--r-folha) var(--r-folha) 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.28);
  animation:sobe .22s ease}
@keyframes sobe{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.folha-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px;border-bottom:var(--borda-fina)}
.folha-topo h2{font-size:1.12rem}
.folha-corpo{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.folha-rodape{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:var(--borda-fina);background:var(--surf2);flex-wrap:wrap}
@media (min-width:700px){.folha{align-items:center}.folha-card{border-radius:var(--r-folha);max-height:88vh}}

/* ---- formulário ---- */
.form{display:flex;flex-direction:column;gap:14px}
.bloco{display:flex;flex-direction:column;gap:6px}
.rotulo{font-family:var(--fu);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;opacity:.55}
.form input[type=text],.form input[type=date],.form input[type=search],.form input[type=datetime-local],.form select,.form textarea{
  width:100%;padding:10px 13px;border-radius:var(--r2);border:var(--borda);background:var(--surf);font-size:.94rem}
.form textarea{resize:vertical;line-height:1.5;font-family:var(--ff)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.dupla{grid-template-columns:1fr}}
.ajuda{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ajuda span,.decod{font-size:.75rem;opacity:.65;font-family:var(--fu)}
.troca{display:flex;align-items:center;gap:10px;font-size:.9rem}
.troca input{width:20px;height:20px;accent-color:var(--ac)}
.menu{display:flex;flex-direction:column;gap:6px}
.menu>button{text-align:left;padding:12px 14px;border-radius:var(--r2);background:var(--surf);border:var(--borda);font-size:.92rem}
.menu>button b{display:block}
.menu>button span{display:block;font-size:.76rem;opacity:.55;font-family:var(--fu)}
.menu>button.on{border-color:var(--ac);background:var(--ac2)}
.menu>button.perigo{color:var(--perigo)}
.linha-gerencia{display:flex;gap:6px;align-items:stretch}
.linha-gerencia>button:first-child{flex:1;text-align:left;padding:12px 14px;border-radius:var(--r2);background:var(--surf);border:var(--borda)}
.linha-gerencia>button:first-child b{display:block;font-size:.92rem}
.linha-gerencia>button:first-child span{display:block;font-size:.75rem;opacity:.55;font-family:var(--fu)}
.cores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cor{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r2);background:var(--surf);border:var(--borda);font-size:.82rem}
.cor i{width:18px;height:18px;border-radius:50%;flex:none}
.cor.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.cor[data-cor=lilas] i{background:#7A56D6}.cor[data-cor=rosa] i{background:#D6567A}.cor[data-cor=azul] i{background:#3E6FD6}
.cor[data-cor=verde] i{background:#2E9E6B}.cor[data-cor=ambar] i{background:#D98A2B}.cor[data-cor=petroleo] i{background:#2B7E8E}

/* ---- ficha imprimível ---- */
.ficha-wrap{background:#e9e6e0;padding:10px;border-radius:var(--r2);overflow:auto}
.ficha{background:#fff;color:#161616;width:100%;max-width:620px;margin:0 auto;padding:26px 24px 30px;
  font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.45;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.ficha-topo{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.ficha .brasao{width:56px;height:56px;border-radius:50%;border:2px solid #161616;display:grid;place-items:center;
  font-weight:700;font-size:15px;flex:none;letter-spacing:.04em}
.ficha-ident p{margin:1px 0}
.ficha-tema{margin:10px 0 14px}
.ficha-tema p{margin:2px 0}
.ficha-sec{border:1px solid #161616;border-bottom:0;padding:8px 12px 10px}
.ficha-sec:last-of-type{border-bottom:1px solid #161616}
.ficha-sec h3{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:16px;text-align:center;margin-bottom:6px;font-weight:700}
.ficha-sec ul,.ficha-sec ol{margin:0;padding-left:22px}
.ficha-sec li{margin:2px 0}
.ficha-sec .momentos{list-style:none;padding-left:0}
.ficha-sec .momentos li{margin:3px 0}
.ficha-pe{margin-top:26px;text-align:center;border-top:1px solid #161616;padding-top:5px;width:60%;margin-left:auto;margin-right:auto;font-size:12px}

/* ---- leitura ---- */
.leitura{position:fixed;inset:0;z-index:70;background:var(--leitura-bg);color:var(--leitura-ink);display:none;overflow:auto}
.leitura.open{display:block}
.leitura-topo{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--leitura-bg);border-bottom:var(--borda-fina)}
.leitura-tam{display:flex;gap:6px}
.leitura-tam button{padding:6px 12px;border-radius:999px;border:var(--borda);font-family:var(--fu);font-size:.8rem}
.leitura-corpo{max-width:640px;margin:0 auto;padding:24px 20px 80px}
.leitura-corpo h1{font-size:1.7rem;margin:6px 0 16px}
.leitura-corpo .texto{font-size:1.05rem;line-height:1.75;font-family:var(--f-leitura)}

/* ---- toast ---- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  z-index:80;display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:999px;background:var(--toast-bg);
  color:var(--toast-ink);font-size:.86rem;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.2s;max-width:92vw}

/* ---- impressão ---- */
@media print{
  .app,.nav,.toast,.leitura,.folha-topo,.folha-rodape{display:none!important}
  .folha{position:static;display:block!important;background:none;backdrop-filter:none}

  .folha-corpo{overflow:visible;padding:0}
  .ficha-wrap{background:none;padding:0}
  .ficha{box-shadow:none;max-width:100%}
  body{background:#fff}
}

/* ---- desktop ---- */
@media (min-width:900px){
  .app{padding-bottom:0;padding-left:var(--rail,0px)}
}

/* ---- editor de plano em tela cheia, com prévia ao vivo ---- */
.editor{position:fixed;inset:0;z-index:55;background:var(--bg);display:none;flex-direction:column}
.editor.open{display:flex}
.ed-topo{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;

.ed-abas{flex:1;display:flex;gap:6px;justify-content:center}

.ed-abas button.on{opacity:1;background:var(--ac);color:var(--ac-ink);border-color:transparent}
.ed-corpo{flex:1;display:flex;min-height:0}
.ed-form,.ed-previa{flex:1;min-width:0;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.ed-previa{background:var(--surf2);border-left:var(--borda-fina)}
.ed-previa-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ed-vivo{display:inline-flex;align-items:center;gap:6px;font-family:var(--fu);font-size:.66rem;

.ed-vivo::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ac);animation:pulsa 1.8s ease-in-out infinite}

.ed-baixar{display:flex;gap:8px;justify-content:center;margin-top:14px}
.espaco-rodape{height:28px}
.editor[data-aba=editar] .ed-previa{display:none}
.editor[data-aba=previa] .ed-form{display:none}
@media (min-width:1000px){
  .ed-abas{display:none}

  .ed-form{max-width:52%;padding:22px 24px}
  .ed-previa{padding:22px 24px}
}

/* ---- animação ao arrastar entre abas ---- */
.vista.anima-esq{animation:entraDaDireita .24s ease}
.vista.anima-dir{animation:entraDaEsquerda .24s ease}
@keyframes entraDaDireita{from{transform:translateX(26px);opacity:.25}to{transform:none;opacity:1}}
@keyframes entraDaEsquerda{from{transform:translateX(-26px);opacity:.25}to{transform:none;opacity:1}}

/* ---- linhas de gerência ---- */
.linha-gerencia>button.estatico{cursor:default}
.linha-gerencia .ico{width:40px;border-radius:var(--r2);border:var(--borda);background:var(--surf);font-size:1rem}
.linha-gerencia .ico[disabled]{opacity:.3;cursor:default}
.menu>button[disabled]{opacity:.45;cursor:default}
.cartao>.ico.mini{align-self:center;opacity:.35}
.cartao>.ico.mini:hover{opacity:1;color:var(--perigo);background:var(--hover)}

/* ---- nome editável na saudação ---- */
.nome-edit{font:inherit;color:var(--ac);border-bottom:2px dotted var(--ac);padding:0 2px;line-height:1}
.nome-edit.vazio{font-family:var(--fu);font-size:.8rem;font-weight:600;border:1px dashed var(--ac);
  border-radius:999px;padding:4px 12px;vertical-align:middle;margin-left:4px}

/* ---- primeiros passos ---- */
.passos{list-style:none;margin:0 0 20px;padding:0;counter-reset:passo}
.passos li{counter-increment:passo;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 16px 14px 52px;border-radius:var(--r);background:var(--surf);border:var(--borda);
  margin-bottom:9px;position:relative;box-shadow:var(--sombra)}
.passos li::before{content:counter(passo);position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ac2);
  color:var(--ac-forte);font-family:var(--fd);font-weight:700;font-size:.95rem}
.passos li.feito::before{content:'✓';background:var(--ac);color:var(--ac-ink)}
.passos li b{flex:1;font-size:.98rem}
.passos li span{width:100%;order:3;font-size:.78rem;opacity:.55;font-family:var(--fu)}
.passos li .btn{flex:none}
.passos li .btn[disabled]{opacity:.4}

/* ---- campos extras do plano ---- */
.chip.mais{border-style:dashed;font-weight:700;color:var(--ac);border-color:var(--ac)}

.mais-campo{width:100%;border-style:dashed!important;color:var(--ac);font-weight:700}

    });

  function carrega() {
    try { D = JSON.parse(LS.getItem(KEY)); } catch (e) { D = null; }

    ['escolas', 'turmas', 'planos', 'notas', 'listas', 'lembretes', 'eventos', 'banco', 'modelos', 'camposExtra'].forEach(function (k) { if (!Array.isArray(D[k])) D[k] = []; });
    var o = D.cfg.ordem;
    if (!Array.isArray(o) || o.length !== ORDEM_PADRAO.length || ORDEM_PADRAO.some(function (k) { return o.indexOf(k) < 0; })) D.cfg.ordem = ORDEM_PADRAO.slice();
    if (typeof D.cfg.professor !== 'string') D.cfg.professor = '';
  }
  var salvaTimer = null;
  function salva() { clearTimeout(salvaTimer); salvaTimer = setTimeout(function () { try { LS.setItem(KEY, JSON.stringify(D)); } catch (e) { toast('Não consegui salvar neste navegador.'); } }, 120); }

  function camposTodos() { return CAMPOS.concat(D.camposExtra || []); }
  function nomeCampo(c) { var x = camposTodos().filter(function (y) { return y.c === c; })[0]; return x ? x.n : c; }

  var byId = function (arr, id) { return arr.filter(function (x) { return x.id === id; })[0] || null; };
  var turmaAtual = function () { return byId(D.turmas, D.cfg.turma); };
  var escolaAtual = function () { return byId(D.escolas, D.cfg.escola); };

  function planosVisiveis() {
    return D.planos.filter(function (p) {
      if (D.cfg.escola && p.escolaId !== D.cfg.escola) return false;
      if (D.cfg.turma && D.cfg.turma !== '*' && p.turmaId !== D.cfg.turma) return false;
      return true;
    }).sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); });
  }
  var nomeTurma = function (id) { var t = byId(D.turmas, id); return t ? t.nome : '—'; };
  function nomeProf(t) { return (t && t.professor) ? t.professor : (D.cfg.professor || ''); }

  /* ---------- aparência ---------- */

    var r = document.documentElement;

  /* ---------- avisos e folhas ---------- */
  var toastT = null;
  function toast(msg, acao, cb) {
    var t = $('#toast');

    t.classList.add('show');
    if (acao) $('#toast-act').onclick = function () { t.classList.remove('show'); cb && cb(); };
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, acao ? 6000 : 2600);
  }

  var sheetOnClose = null;
  function abreFolha(titulo, corpo, rodape, aoFechar) {
    sheetOnClose = aoFechar || null;
    var s = $('#folha');
    s.innerHTML = '<div class="folha-card" role="dialog" aria-modal="true">' +
      '<div class="folha-topo"><h2>' + esc(titulo) + '</h2><button class="ico" data-fechar aria-label="Fechar">✕</button></div>' +

  function fechaFolha() {
    var s = $('#folha'); if (!s.classList.contains('open')) return;
    s.classList.remove('open'); s.innerHTML = '';
    if (!$('#editor').classList.contains('open')) document.body.classList.remove('travado');

  }
  function pergunta(txt, cb, rotulo) {
    abreFolha('Confirmar', '<p class="p">' + esc(txt) + '</p>',

  }

  /* =======================================================================
     VISÕES
     ======================================================================= */
  var vistaAtual = 'inicio';
  var mesAgenda = (function () { var d = new Date(); return { a: d.getFullYear(), m: d.getMonth() }; })();
  var diaAgenda = hojeISO();

  function irPara(v, dir) {
    vistaAtual = v;
    $$('.nav button').forEach(function (b) {
      var on = b.dataset.vista === v;
      b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false');
      if (on && b.scrollIntoView) { try { b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); } catch (e) { } }
    });
    render();
    var m = $('#vista');
    if (m && dir) {
      m.classList.remove('anima-esq', 'anima-dir');
      void m.offsetWidth;
      m.classList.add(dir === 'esq' ? 'anima-esq' : 'anima-dir');
    }
    window.scrollTo(0, 0);
  }

  /* ---------- arrastar para trocar de aba ---------- */
  (function () {
    var x0 = 0, y0 = 0, t0 = 0, valido = false;
    var bloqueia = function (t) {
      return !t || !t.closest || !!t.closest('.nav, textarea, input, select, .ficha-wrap, .ed-corpo, .folha, .leitura');
    };
    document.addEventListener('touchstart', function (ev) {
      valido = false;
      if (ev.touches.length !== 1) return;
      if ($('#folha').classList.contains('open') || $('#editor').classList.contains('open') || $('#leitura').classList.contains('open')) return;
      if (bloqueia(ev.target)) return;
      x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; t0 = Date.now(); valido = true;
    }, { passive: true });
    document.addEventListener('touchend', function (ev) {
      if (!valido) return; valido = false;
      var t = ev.changedTouches[0];
      var dx = t.clientX - x0, dy = t.clientY - y0;
      if (Date.now() - t0 > 800) return;
      if (Math.abs(dx) < 65 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      var o = ordem(), i = o.indexOf(vistaAtual);
      if (i < 0) return;
      var j = dx < 0 ? i + 1 : i - 1;
      if (j < 0 || j >= o.length) return;
      irPara(o[j], dx < 0 ? 'esq' : 'dir');
    }, { passive: true });
  })();

  function render() {
    var v = $('#vista');
    var mapa = { inicio: vInicio, planos: vPlanos, notas: vNotas, listas: vListas, lembretes: vLembretes, agenda: vAgenda };
    v.innerHTML = (mapa[vistaAtual] || vInicio)();
    barraEscopo();
  }

  function barraEscopo() {
    var b = $('#escopo'); if (!b) return;
    var e = escolaAtual(), t = turmaAtual();
    b.innerHTML =
      '<button class="escopo-btn" data-act="trocar-escola"><span class="rot">Escola</span><span class="val">' + esc(e ? e.nome : 'Escolher escola') + '</span></button>' +
      '<button class="escopo-btn" data-act="trocar-turma"><span class="rot">Turma</span><span class="val">' + esc(D.cfg.turma === '*' ? 'Todas as turmas' : (t ? t.nome : 'Escolher turma')) + '</span></button>';
  }

  /* ---------- INÍCIO ---------- */
  function vInicio() {
    var h = hojeISO();
    if (!D.escolas.length || !D.turmas.length) return primeirosPassos();
    var pv = planosVisiveis();
    var futuros = pv.filter(function (p) { return p.data >= h; }).sort(function (a, b) { return a.data.localeCompare(b.data); });
    var doMes = pv.filter(function (p) { return p.data.slice(0, 7) === h.slice(0, 7); });
    var pend = D.lembretes.filter(function (l) { return !l.feito; }).sort(function (a, b) { return (a.quando || '').localeCompare(b.quando || ''); });
    var hojeLem = pend.filter(function (l) { return (l.quando || '').slice(0, 10) <= h; });
    var itensLista = D.listas.reduce(function (a, l) { return a + l.itens.filter(function (i) { return !i.feito; }).length; }, 0);

    var s = '<div class="saudacao"><p class="eyebrow">' + esc(diaSemana(h)) + ' · ' + esc(dtExt(h)) + '</p>' +
      '<h1>' + saudacaoTexto() + '</h1>' +
      '<p class="sub">' + (futuros.length ? 'Próxima aula planejada em <strong>' + esc(dt(futuros[0].data)) + '</strong>.' : 'Nenhum plano futuro ainda. Que tal montar o de amanhã?') + '</p></div>';

    s += '<div class="grade-kpi">' +
      kpi(doMes.length, 'planos neste mês', 'planos') +
      kpi(hojeLem.length, 'lembretes para hoje', 'lembretes') +
      kpi(itensLista, 'itens em aberto', 'listas') +
      kpi(D.notas.length, 'anotações', 'notas') + '</div>';

    s += '<div class="secao"><div class="secao-topo"><h2>Semana</h2><button class="link" data-vista="agenda">Ver agenda</button></div>' + tiraSemana() + '</div>';

    s += '<div class="secao"><div class="secao-topo"><h2>Próximos planos</h2><button class="link" data-act="novo-plano">Novo plano</button></div>';
    if (!futuros.length && !pv.length) s += vazio('Nenhum plano por aqui', 'Crie o primeiro plano da turma e ele aparece nesta tela, na agenda e no PDF.', 'Criar plano', 'novo-plano');
    else s += (futuros.length ? futuros : pv).slice(0, 4).map(cardPlano).join('');
    s += '</div>';

    if (pend.length) {
      s += '<div class="secao"><div class="secao-topo"><h2>Lembretes</h2><button class="link" data-vista="lembretes">Ver todos</button></div>' +
        pend.slice(0, 3).map(cardLembrete).join('') + '</div>';
    }

    s += '<div class="secao"><div class="secao-topo"><h2>Atalhos</h2></div><div class="atalhos">' +
      '<button class="atalho" data-act="novo-plano"><b>Novo plano</b><span>ficha completa da aula</span></button>' +
      '<button class="atalho" data-act="nova-nota"><b>Anotação</b><span>com data e tema</span></button>' +
      '<button class="atalho" data-act="nova-lista"><b>Check-list</b><span>materiais, tarefas</span></button>' +
      '<button class="atalho" data-act="novo-lembrete"><b>Lembrete</b><span>com aviso no celular</span></button>' +
      '</div></div>';
    return s;
  }
  function saudacaoTexto() {
    var hh = new Date().getHours();
    var t = hh < 12 ? 'Bom dia' : hh < 18 ? 'Boa tarde' : 'Boa noite';
    var n = nomeProf(turmaAtual());
    return n
      ? esc(t) + ', <button class="nome-edit" data-act="editar-nome">' + esc(n.split(' ')[0]) + '</button>.'

  function editorNome() {
    abreFolha('Seu nome', '<div class="form">' +
      campo('Como você quer ser chamada(o)', '<input type="text" id="nm" placeholder="Ex.: Mayara Souza" value="' + esc(D.cfg.professor || '') + '">') +

      '<button class="btn ghost" data-fechar>Voltar</button><button class="btn" id="sv-nm">Salvar</button>');
    $('#sv-nm').onclick = function () { D.cfg.professor = $('#nm').value.trim(); salva(); fechaFolha(); render(); toast(D.cfg.professor ? 'Prazer, ' + D.cfg.professor.split(' ')[0] + '.' : 'Nome removido.'); };
  }
  function primeirosPassos() {
    var semEscola = !D.escolas.length;
    return '<div class="saudacao"><p class="eyebrow">' + esc(diaSemana(hojeISO()) + ' · ' + dtExt(hojeISO())) + '</p>' +
      '<h1>' + saudacaoTexto() + '</h1>' +
      '<p class="sub">Três passos e o app fica pronto para o seu dia a dia.</p></div>' +
      '<ol class="passos">' +
      '<li' + (D.cfg.professor ? ' class="feito"' : '') + '><b>Seu nome</b><span>assina a ficha e abre a tela inicial</span>' +
      '<button class="btn mini" data-act="editar-nome">' + (D.cfg.professor ? 'Mudar' : 'Escrever') + '</button></li>' +
      '<li' + (semEscola ? '' : ' class="feito"') + '><b>A escola</b><span>nome, cidade e sigla do cabeçalho</span>' +
      '<button class="btn mini" data-act="editar-escola" data-id="">' + (semEscola ? 'Cadastrar' : 'Ver') + '</button></li>' +

  function kpi(n, r, vista) { return '<button class="kpi" data-vista="' + vista + '"><b>' + n + '</b><span>' + r + '</span></button>'; }

  function tiraSemana() {
    var base = new Date(); base.setDate(base.getDate() - base.getDay());
    var s = '<div class="semana">';
    for (var i = 0; i < 7; i++) {
      var d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
      var iso = new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
      var n = planosVisiveis().filter(function (p) { return p.data === iso; }).length;

        '<span class="ds">' + DIAS[i] + '</span><span class="dn">' + d.getDate() + '</span>' +
        '<span class="pontos">' + (n ? new Array(Math.min(n, 3) + 1).join('<i></i>') : '') + '</span></button>';

  function cardPlano(p) {
    var t = byId(D.turmas, p.turmaId);

  var filtroPlano = '';

    s += '<div class="linha-acoes"><button class="chip" data-act="importar-plano">Importar plano</button><button class="chip" data-act="modelos">Meus modelos</button><button class="chip" data-act="banco">Banco de habilidades</button></div>';

  /* ---------- EDITOR DE PLANO EM TELA CHEIA, COM PRÉVIA AO VIVO ---------- */

    if (!infantil) {
      c += campo('Avaliação', '<textarea data-f="avaliacao" rows="3" placeholder="Como você vai perceber que a turma aprendeu">' + esc(p.avaliacao) + '</textarea>');

  function editorPlano(ref, aba) {
    var obj = (ref && typeof ref === 'object') ? ref : null;

    var novo = !ref;

    var p = obj ? obj : novo ? {
      id: uid(), escolaId: D.cfg.escola, turmaId: (D.cfg.turma && D.cfg.turma !== '*') ? D.cfg.turma : (turmasDaEscola()[0] || {}).id,

    } : byId(D.planos, id);

  function colheEditor(alvo) {
    var e = $('#editor');
    e.querySelectorAll('[data-f]').forEach(function (i) { alvo[i.dataset.f] = i.value; });
    alvo.campos = Array.prototype.slice.call(e.querySelectorAll('[data-campo].on')).map(function (b) { return b.dataset.campo; });
    alvo.extras = Array.prototype.slice.call(e.querySelectorAll('[data-x]')).map(function (t) { return { rot: t.dataset.rot, txt: t.value }; });
    var st = e.querySelector('[data-status].on'); alvo.status = st ? st.dataset.status : 'planejado';
    var tt = byId(D.turmas, alvo.turmaId); if (tt) alvo.escolaId = tt.escolaId;

  function atualizaPrevia() {
    if (!edPlano) return;
    colheEditor(edPlano);

  function previaDepois() { clearTimeout(edTimer); edTimer = setTimeout(atualizaPrevia, 220); }

  function ligaEditor(p) {
    var e = $('#editor');
    e.querySelectorAll('[data-campo]').forEach(function (b) { b.onclick = function () { b.classList.toggle('on'); atualizaPrevia(); }; });
    e.querySelectorAll('[data-status]').forEach(function (b) {
      b.onclick = function () { e.querySelectorAll('[data-status]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); atualizaPrevia(); };
    });
    e.querySelectorAll('[data-aba]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.aba === e.dataset.aba);
      b.onclick = function () {
        e.dataset.aba = b.dataset.aba;
        e.querySelectorAll('[data-aba]').forEach(function (x) { x.classList.toggle('on', x === b); });
        atualizaPrevia();
      };
    });
    e.addEventListener('input', previaDepois);
    e.addEventListener('change', function (ev) { if (ev.target.dataset.f !== 'turmaId') atualizaPrevia(); });
    var bt = e.querySelector('[data-f="turmaId"]');
    if (bt) bt.onchange = function () { colheEditor(p); p.turmaId = bt.value; editorPlano(p, e.dataset.aba); };
    var br = e.querySelector('#ed-rotina');
    if (br) br.onclick = function () {
      var m = e.querySelector('[data-f="metodologia"]');
      m.value = m.value.trim() ? m.value.trim() + '\n' + ROTINA_INFANTIL : ROTINA_INFANTIL;
      atualizaPrevia();
    };
    var bc = e.querySelector('#ed-campo-novo');
    if (bc) bc.onclick = function () { colheEditor(p); abreCampoNovo(p); };
    var bx = e.querySelector('#ed-extra-novo');
    if (bx) bx.onclick = function () { colheEditor(p); abreExtraNovo(p); };
    e.querySelectorAll('[data-extra-fora]').forEach(function (b) {
      b.onclick = function () {
        colheEditor(p);
        p.extras.splice(Number(b.dataset.extraFora), 1);
        editorPlano(p, e.dataset.aba);
      };
    });
    var bb = e.querySelector('#ed-banco');
    if (bb) bb.onclick = function () { abreBanco('editor'); };
    e.querySelector('#ed-png').onclick = function () { colheEditor(p); baixa(p, 'png'); };
    e.querySelector('#ed-pdf').onclick = function () { colheEditor(p); baixa(p, 'pdf'); };
    e.querySelector('#ed-salvar').onclick = function () { salvaEditor(true); };
    e.querySelector('#ed-fechar').onclick = function () { salvaEditor(false); };
    var mm = e.querySelector('#ed-mais');
    if (mm) mm.onclick = function () {
      colheEditor(p); salva();
      abreFolha('Mais opções', '<div class="menu">' +
        '<button data-act="duplicar" data-id="' + p.id + '">Duplicar para outra data</button>' +
        '<button data-act="salvar-modelo" data-id="' + p.id + '">Salvar como modelo</button>' +
        '<button data-act="exportar-plano" data-id="' + p.id + '">Exportar plano (arquivo)</button>' +
        '<button data-act="whats" data-id="' + p.id + '">Enviar resumo no WhatsApp</button>' +
        '<button data-act="imprimir-plano">Imprimir</button>' +
        '<button class="perigo" data-act="excluir-plano" data-id="' + p.id + '">Excluir plano</button>' +
        '</div>', '<button class="btn ghost" data-fechar>Fechar</button>');
    };
  }

  function salvaEditor(explicito) {
    var p = edPlano; if (!p) { fechaEditor(); return; }
    colheEditor(p);
    var temConteudo = (p.tema || '').trim() || linhas(p.objetivos).length || linhas(p.metodologia).length;
    if (explicito && !(p.tema || '').trim()) { toast('Dê um tema ao plano para encontrá-lo depois.'); return; }
    if (temConteudo) {
      if (!(p.tema || '').trim()) p.tema = 'Plano sem tema';
      if (!byId(D.planos, p.id)) D.planos.push(p);
      salva(); fechaEditor(); render(); toast('Plano salvo.');
    } else {
      fechaEditor(); render();
    }
  }
  function fechaEditor() {
    var e = $('#editor');
    e.classList.remove('open'); e.innerHTML = ''; edPlano = null;
    if (!$('#folha').classList.contains('open')) document.body.classList.remove('travado');
  }

  function campo(rot, ctrl) { return '<label class="bloco"><span class="rotulo">' + esc(rot) + '</span>' + ctrl + '</label>'; }

  /* ---------- FICHA (visual de impressão) ---------- */
  function fichaHTML(p) {
    var t = byId(D.turmas, p.turmaId), e = byId(D.escolas, p.escolaId) || escolaAtual();
    var infantil = t && t.etapa === 'infantil';
    var camposNomes = (p.campos || []).map(nomeCampo);
    var s = '<div class="ficha" id="ficha-alvo">';
    s += '<div class="ficha-topo"><div class="brasao">' + esc((e && e.sigla) || (e ? e.nome.slice(0, 2).toUpperCase() : 'ES')) + '</div>' +
      '<div class="ficha-ident"><p><strong>' + esc(e ? e.nome : '') + '</strong></p>' +
      '<p>' + esc((e && e.cidade ? e.cidade + ', ' : '') + dtExt(p.data)) + '.</p>' +
      '<p>Professor(a): ' + esc(nomeProf(t) || '—') + '.</p>' +
      '<p>Turma: ' + esc(t ? t.nome : '—') + '.</p></div></div>';
    s += '<div class="ficha-tema">' + camposNomes.map(function (n) { return '<p>' + esc(n) + '.</p>'; }).join('') +
      (p.componente ? '<p>' + esc(p.componente) + (p.unidade ? ' — ' + esc(p.unidade) : '') + '.</p>' : '') +
      (p.tema ? '<p>' + esc(p.tema) + '.</p>' : '') + '</div>';
    var sec = function (tit, html) { return '<section class="ficha-sec"><h3>' + tit + '</h3>' + html + '</section>'; };
    var ul = function (arr) { return '<ul>' + arr.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>'; };
    var obj = linhas(p.objetivos);
    if (obj.length) s += sec(infantil ? 'Objetivos de Aprendizagem:' : 'Habilidades:', ul(obj));
    var con = linhas(p.conhecimentos);
    if (con.length) s += sec(infantil ? 'Conhecimentos e Saberes:' : 'Objetos de Conhecimento:', ul(con));
    var met = linhas(p.metodologia);
    if (met.length) s += sec('Metodologia:', infantil
      ? '<ol class="momentos">' + met.map(function (l, i) { return '<li><b>' + (i + 1) + 'º Momento:</b> ' + esc(l) + '</li>'; }).join('') + '</ol>'
      : '<ol>' + met.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ol>');
    var rec = linhas(p.recursos);
    if (rec.length) s += sec('Recursos:', ul(rec));
    (p.extras || []).forEach(function (x) {
      if (!x || !(x.txt || '').trim()) return;
      var ls = linhas(x.txt);
      s += sec(esc(x.rot) + ':', ls.length > 1 ? ul(ls) : '<p>' + nl(x.txt) + '</p>');
    });
    if (p.avaliacao) s += sec('Avaliação:', '<p>' + nl(p.avaliacao) + '</p>');
    if (p.tarefa) s += sec('Tarefa de casa:', '<p>' + nl(p.tarefa) + '</p>');
    s += '<p class="ficha-pe">' + esc(nomeProf(t)) + '</p>';
    return s + '</div>';
  }

  function carregaLib(url) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = url; s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
  }
  function nomeArquivo(p) {
    var t = byId(D.turmas, p.turmaId);
    return ('plano ' + (p.data || '') + ' ' + (t ? t.nome : '') + ' ' + (p.tema || '')).replace(/[^\wÀ-ÿ \-]/g, '').trim().replace(/\s+/g, '-').toLowerCase();
  }
  function baixa(p, tipo) {
    var alvo = $('#ficha-alvo'); if (!alvo) return;
    toast('Preparando o arquivo…');
    var libs = [carregaLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')];
    if (tipo === 'pdf') libs.push(carregaLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'));
    Promise.all(libs).then(function () {
      return html2canvas(alvo, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    }).then(function (cv) {
      if (tipo === 'png') {
        var a = document.createElement('a'); a.download = nomeArquivo(p) + '.png'; a.href = cv.toDataURL('image/png'); a.click();
        toast('Imagem baixada.');
      } else {
        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF('p', 'mm', 'a4');
        var lw = 210 - 20, lh = cv.height * lw / cv.width;
        var img = cv.toDataURL('image/jpeg', 0.94);
        var y = 10, resta = lh, pag = 0;
        while (resta > 0) {
          if (pag) pdf.addPage();
          pdf.addImage(img, 'JPEG', 10, y - pag * (297 - 20), lw, lh);
          resta -= (297 - 20); pag++;
          if (pag > 12) break;
        }
        pdf.save(nomeArquivo(p) + '.pdf');
        toast('PDF baixado.');
      }
    }).catch(function () {
      toast('Sem internet para gerar o arquivo. Abrindo a impressão.', 'Imprimir', imprimirFicha);
      imprimirFicha();
    });
  }
  function imprimirFicha() { document.body.classList.add('imprimindo'); setTimeout(function () { window.print(); document.body.classList.remove('imprimindo'); }, 60); }

  function pedePermissao() {

  var timers = [];
  function agendaAvisos() {
    timers.forEach(clearTimeout); timers = [];

    D.lembretes.forEach(function (l) {
      if (l.feito || !l.avisar || !l.quando) return;
      var t = new Date(l.quando).getTime() - agora;
      if (t > 0 && t < 6 * 3600e3) timers.push(setTimeout(function () { try { new Notification(l.titulo, { body: l.nota || 'Lembrete de hoje', tag: l.id }); } catch (e) { } }, t));

  function vAgenda() {

      '<button class="ico" data-act="mes" data-d="1">›</button></div>';
    s += '<div class="calendario"><div class="cal-cab">' + DIAS.map(function (d) { return '<span>' + d + '</span>'; }).join('') + '</div><div class="cal-grade">';
    for (var i = 0; i < inicio; i++) s += '<span class="cel fora"></span>';
    for (var d = 1; d <= qtd; d++) {
      var iso = a + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      var np = planosVisiveis().filter(function (p) { return p.data === iso; }).length;

      var ne = D.eventos.filter(function (e) { return e.data === iso; }).length;
      s += '<button class="cel' + (iso === hojeISO() ? ' hoje' : '') + (iso === diaAgenda ? ' sel' : '') + '" data-act="dia" data-dia="' + iso + '">' +
        '<span class="n">' + d + '</span><span class="pontos">' +
        (np ? '<i class="p1"></i>' : '') + (nl2 ? '<i class="p2"></i>' : '') + (ne ? '<i class="p3"></i>' : '') + '</span></button>';

      (D.modelos.length ? D.modelos.map(function (m) {
        return '<div class="linha-gerencia"><button data-act="usar-modelo" data-id="' + m.id + '"><b>' + esc(m.tema || 'Modelo') + '</b><span>' + esc(ETAPAS[m._etapa] ? ETAPAS[m._etapa].curto : '') + '</span></button>' +
          '<button class="ico" data-act="apagar-modelo" data-id="' + m.id + '">✕</button></div>';
      }).join('') : '<p class="dica">Nenhum modelo salvo. Abra um plano, toque em <strong>Mais</strong> e escolha “Salvar como modelo”.</p>') + '</div></div>';
    abreFolha('Meus modelos', corpo, '<button class="btn" data-fechar>Fechar</button>');
  }

  /* ---------- IMPORTAR / EXPORTAR ---------- */
  function baixaJSON(obj, nome) {
    var b = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nome; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function pedeArquivo(cb) {
    var i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json,.json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { try { cb(JSON.parse(r.result)); } catch (e) { toast('Arquivo não reconhecido.'); } };
      r.readAsText(f);
    };
    i.click();
  }

  /* ---------- BUSCA GLOBAL ---------- */
  function abreBusca() {
    abreFolha('Buscar', '<div class="form"><div class="busca"><input type="search" id="q-geral" placeholder="Uma palavra procura em tudo"></div><div id="res-busca"></div></div>', '<button class="btn ghost" data-fechar>Fechar</button>');
    var inp = $('#q-geral');
    inp.oninput = function () {
      var q = inp.value.toLowerCase().trim(); var box = $('#res-busca');
      if (q.length < 2) { box.innerHTML = '<p class="dica">Digite pelo menos duas letras.</p>'; return; }
      var r = '';
      D.planos.filter(function (p) { return (p.tema + p.objetivos + p.conhecimentos + p.metodologia + p.recursos).toLowerCase().indexOf(q) >= 0; }).slice(0, 8).forEach(function (p) { r += cardPlano(p); });
      D.notas.filter(function (n) { return (n.titulo + n.tema + n.texto).toLowerCase().indexOf(q) >= 0; }).slice(0, 8).forEach(function (n) {
        r += '<article class="cartao nota" data-act="abrir-nota" data-id="' + n.id + '"><div class="cartao-txt"><p class="meta">' + esc(dt(n.data)) + '</p><h3>' + esc(n.titulo || 'Anotação') + '</h3></div></article>';
      });
      D.lembretes.filter(function (l) { return (l.titulo + l.nota).toLowerCase().indexOf(q) >= 0; }).slice(0, 5).forEach(function (l) { r += cardLembrete(l); });
      box.innerHTML = r || '<p class="dica">Nada encontrado com essa palavra.</p>';
    };
    inp.focus();
  }

  /* =======================================================================
     EVENTOS
     ======================================================================= */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-vista]'); if (b) { irPara(b.dataset.vista); return; }
    if (ev.target.closest('[data-fechar]')) { fechaFolha(); return; }
    if ($('#folha').classList.contains('open') && ev.target === $('#folha')) { fechaFolha(); return; }
    var a = ev.target.closest('[data-act]'); if (!a) return;
    var id = a.dataset.id, act = a.dataset.act;

    switch (act) {
      case 'ajustes': abreAjustes(); break;
      case 'busca': abreBusca(); break;
      case 'novo-plano': {
        fechaFolha();
        if (!turmasDaEscola().length) { toast('Cadastre uma turma primeiro.'); editorTurma(null); break; }
        editorPlano(null); break;
      }
      case 'nova-escola': editorEscola(null); break;
      case 'abrir-plano': fechaFolha(); editorPlano(id); break;
      case 'ver-ficha': fechaFolha(); editorPlano(id, 'previa'); break;
      case 'editar-plano': fechaFolha(); editorPlano(id); break;
      case 'imprimir-plano': fechaFolha(); imprimirFicha(); break;
      case 'excluir-plano': pergunta('Excluir este plano?', function () {
        D.planos = D.planos.filter(function (x) { return x.id !== id; });
        salva(); fechaFolha(); if (edPlano && edPlano.id === id) fechaEditor(); render(); toast('Plano excluído.');
      }); break;
      case 'excluir-nota': pergunta('Excluir esta anotação?', function () { D.notas = D.notas.filter(function (x) { return x.id !== id; }); salva(); fechaFolha(); render(); toast('Anotação excluída.'); }); break;
      case 'excluir-lembrete': pergunta('Excluir este lembrete?', function () { D.lembretes = D.lembretes.filter(function (x) { return x.id !== id; }); salva(); fechaFolha(); render(); toast('Lembrete excluído.'); }); break;
      case 'excluir-evento': pergunta('Excluir este evento?', function () { D.eventos = D.eventos.filter(function (x) { return x.id !== id; }); salva(); fechaFolha(); render(); toast('Evento excluído.'); }); break;
      case 'duplicar': {
        var p0 = byId(D.planos, id); if (!p0) break;
        var c = JSON.parse(JSON.stringify(p0)); c.id = uid(); c.data = hojeISO(); c.status = 'planejado'; c.criado = Date.now();
        D.planos.push(c); salva(); fechaFolha(); render(); editorPlano(c.id); toast('Cópia criada. Ajuste a data.');
        break;
      }
      case 'salvar-modelo': {
        var pm = byId(D.planos, id); if (!pm) break;
        var mm = JSON.parse(JSON.stringify(pm)); mm.id = uid(); mm._etapa = (byId(D.turmas, pm.turmaId) || {}).etapa || 'infantil';
        D.modelos.push(mm); salva(); fechaFolha(); toast('Modelo salvo.');
        break;
      }
      case 'usar-modelo': {
        var m0 = byId(D.modelos, id); if (!m0) break;
        var np = JSON.parse(JSON.stringify(m0)); np.id = uid(); np.data = hojeISO(); np.status = 'planejado';
        np.turmaId = (D.cfg.turma && D.cfg.turma !== '*') ? D.cfg.turma : np.turmaId; np.escolaId = D.cfg.escola;
        delete np._etapa; D.planos.push(np); salva(); fechaFolha(); render(); editorPlano(np.id);
        break;
      }
      case 'apagar-modelo': D.modelos = D.modelos.filter(function (x) { return x.id !== id; }); salva(); abreModelos(); break;
      case 'modelos': abreModelos(); break;
      case 'banco': abreBanco(null); break;
      case 'usar-hab': {
        var cd = a.dataset.cod;
        if (bancoDestino === 'editor' && edPlano) {
          var tae = $('#editor [data-f="objetivos"]');
          var le = linhas(tae.value); if (le.indexOf(cd) < 0) le.push(cd);
          tae.value = le.join('\n');
          bancoDestino = null; fechaFolha(); atualizaPrevia(); toast(cd + ' acrescentado ao plano.');
        } else if (bancoDestino) {
          var pd = byId(D.planos, bancoDestino);
          if (pd) {
            var ll = linhas(pd.objetivos);
            if (ll.indexOf(cd) < 0) ll.push(cd);
            pd.objetivos = ll.join('\n'); salva();
            var alvo = bancoDestino; bancoDestino = null;
            fechaFolha(); editorPlano(alvo); toast(cd + ' acrescentado ao plano.');
          }
        } else {
          fechaFolha();
          try { navigator.clipboard.writeText(cd); toast('Código ' + cd + ' copiado.'); }
          catch (e) { toast('Código: ' + cd); }
        }
        break;
      }
      case 'apagar-hab': D.banco = D.banco.filter(function (x) { return x.cod !== a.dataset.cod; }); salva(); abreBanco(); break;
      case 'exportar-plano': {
        var pe = byId(D.planos, id); if (!pe) break;
        baixaJSON({ tipo: 'plano', versao: 1, plano: pe, turma: byId(D.turmas, pe.turmaId), escola: byId(D.escolas, pe.escolaId) }, nomeArquivo(pe) + '.json');
        toast('Plano exportado.');
        break;
      }
      case 'importar-plano': pedeArquivo(function (o) {
        var p = o && (o.plano || (o.tipo === 'plano' ? o : null));
        if (!p) { toast('Esse arquivo não tem um plano.'); return; }
        p.id = uid(); p.escolaId = D.cfg.escola; p.turmaId = (D.cfg.turma && D.cfg.turma !== '*') ? D.cfg.turma : (turmasDaEscola()[0] || {}).id;
        D.planos.push(p); salva(); render(); toast('Plano importado.');
      }); break;
      case 'whats': {
        var pw = byId(D.planos, id); if (!pw) break;
        var t = byId(D.turmas, pw.turmaId);
        var txt = '*' + (pw.tema || 'Plano') + '*\n' + dt(pw.data) + ' · ' + (t ? t.nome : '') + '\n\n' +
          (linhas(pw.objetivos).length ? 'Objetivos: ' + linhas(pw.objetivos).join(', ') + '\n' : '') +
          (linhas(pw.metodologia).length ? '\nMetodologia:\n' + linhas(pw.metodologia).map(function (l, i) { return (i + 1) + 'º Momento: ' + l; }).join('\n') + '\n' : '') +
          (linhas(pw.recursos).length ? '\nRecursos: ' + linhas(pw.recursos).join(', ') : '');
        window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
        break;
      }
      case 'nova-nota': fechaFolha(); editorNota(null); break;
      case 'abrir-nota': editorNota(id); break;
      case 'nova-lista': {
        D.listas.unshift({ id: uid(), titulo: 'Nova lista', itens: [] }); salva(); render();
        break;
      }
      case 'renomear-lista': {
        var l0 = byId(D.listas, id);
        abreFolha('Nome da lista', '<div class="form">' + campo('Título', '<input type="text" id="nome-lista" value="' + esc(l0.titulo) + '">') + '</div>',
          '<button class="btn ghost" data-fechar>Voltar</button><button class="btn" id="sv-lista">Salvar</button>');
        $('#sv-lista').onclick = function () { l0.titulo = $('#nome-lista').value || 'Lista'; salva(); fechaFolha(); render(); };
        break;
      }
      case 'excluir-lista': pergunta('Excluir esta lista inteira?', function () { D.listas = D.listas.filter(function (x) { return x.id !== id; }); salva(); render(); }); break;
      case 'item-toggle': { var li = byId(D.listas, id); li.itens[a.dataset.ix].feito = !li.itens[a.dataset.ix].feito; salva(); render(); break; }
      case 'item-remover': { var lr = byId(D.listas, id); lr.itens.splice(Number(a.dataset.ix), 1); salva(); render(); break; }
      case 'item-editar': {
        var le = byId(D.listas, id), ix = Number(a.dataset.ix);
        abreFolha('Item', '<div class="form">' + campo('Texto', '<input type="text" id="it-txt" value="' + esc(le.itens[ix].txt) + '">') + '</div>',
          '<button class="btn ghost" data-fechar>Voltar</button><button class="btn" id="sv-it">Salvar</button>');
        $('#sv-it').onclick = function () { le.itens[ix].txt = $('#it-txt').value; salva(); fechaFolha(); render(); };
        break;
      }
      case 'novo-lembrete': fechaFolha(); editorLembrete(null); break;
      case 'abrir-lembrete': editorLembrete(id); break;
      case 'lembrete-feito': { var lf = byId(D.lembretes, id); lf.feito = !lf.feito; salva(); render(); break; }
      case 'permitir': pedePermissao(); break;
      case 'novo-evento': fechaFolha(); editorEvento(null); break;
      case 'abrir-evento': editorEvento(id); break;
      case 'mes': {
        mesAgenda.m += Number(a.dataset.d);
        if (mesAgenda.m < 0) { mesAgenda.m = 11; mesAgenda.a--; }
        if (mesAgenda.m > 11) { mesAgenda.m = 0; mesAgenda.a++; }
        render(); break;
      }
      case 'dia': {
        diaAgenda = a.dataset.dia;
        var d = diaAgenda.split('-'); mesAgenda = { a: Number(d[0]), m: Number(d[1]) - 1 };
        irPara('agenda'); break;
      }
      case 'trocar-escola': {
        abreFolha('Escola', '<div class="menu">' + D.escolas.map(function (e) {
          return '<button data-act="usar-escola" data-id="' + e.id + '"' + (e.id === D.cfg.escola ? ' class="on"' : '') + '><b>' + esc(e.nome) + '</b><span>' + esc(e.cidade || '') + '</span></button>';
        }).join('') + '<button data-act="editar-escola" data-id="">Acrescentar escola</button></div>', '<button class="btn ghost" data-fechar>Fechar</button>');
        break;
      }
      case 'usar-escola': {
        D.cfg.escola = id; var t1 = turmasDaEscola()[0]; D.cfg.turma = t1 ? t1.id : '';
        salva(); fechaFolha(); barraEscopo(); render(); break;
      }
      case 'trocar-turma': {
        abreFolha('Turma', '<div class="menu">' +
          '<button data-act="usar-turma" data-id="*"' + (D.cfg.turma === '*' ? ' class="on"' : '') + '><b>Todas as turmas</b><span>ver tudo desta escola</span></button>' +
          turmasDaEscola().map(function (t) {
            return '<button data-act="usar-turma" data-id="' + t.id + '"' + (t.id === D.cfg.turma ? ' class="on"' : '') + '><b>' + esc(t.nome) + '</b><span>' + esc(ETAPAS[t.etapa].nome) + '</span></button>';
          }).join('') + '<button data-act="editar-turma" data-id="">Acrescentar turma</button></div>', '<button class="btn ghost" data-fechar>Fechar</button>');
        break;
      }
      case 'usar-turma': D.cfg.turma = id; salva(); fechaFolha(); barraEscopo(); render(); break;
      case 'editar-nome': fechaFolha(); editorNome(); break;
      case 'exemplo': carregaExemplo(); break;
      case 'campos-extra': abreCampoNovo(null); break;
      case 'apagar-campo': {
        var k = a.dataset.k;
        D.camposExtra = D.camposExtra.filter(function (x) { return x.c !== k; });
        D.planos.forEach(function (p) { if (p.campos) p.campos = p.campos.filter(function (c) { return c !== k; }); });
        salva(); abreCampoNovo(edPlano); render();
        break;
      }
      case 'ordem': abreOrdem(); break;
      case 'ordem-sobe': moveAba(a.dataset.k, -1); break;
      case 'ordem-desce': moveAba(a.dataset.k, 1); break;
      case 'ordem-padrao': D.cfg.ordem = ORDEM_PADRAO.slice(); salva(); montaNav(); irPara(vistaAtual); abreOrdem(); break;
      case 'limpeza': abreLimpeza(); break;
      case 'limpar-secao': {
        var k = a.dataset.k;
        pergunta('Apagar todos os itens desta seção? Não dá para desfazer.', function () {
          D[k] = []; salva(); abreLimpeza(); render(); toast('Seção limpa.');
        }, 'Apagar todos');
        break;
      }
      case 'escolas': gerenciaEscolas(); break;
      case 'turmas': gerenciaTurmas(); break;
      case 'editar-escola': editorEscola(id || null); break;
      case 'editar-turma': editorTurma(id || null); break;
      case 'apagar-escola': pergunta('Apagar a escola e tudo ligado a ela?', function () {
        D.escolas = D.escolas.filter(function (x) { return x.id !== id; });
        var ts = D.turmas.filter(function (t) { return t.escolaId === id; }).map(function (t) { return t.id; });
        D.turmas = D.turmas.filter(function (t) { return t.escolaId !== id; });
        D.planos = D.planos.filter(function (p) { return ts.indexOf(p.turmaId) < 0; });
        if (D.cfg.escola === id) { D.cfg.escola = (D.escolas[0] || {}).id || ''; D.cfg.turma = (turmasDaEscola()[0] || {}).id || ''; }
        salva(); gerenciaEscolas(); barraEscopo(); render();
      }); break;
      case 'apagar-turma': pergunta('Apagar a turma e os planos dela?', function () {
        D.turmas = D.turmas.filter(function (x) { return x.id !== id; });
        D.planos = D.planos.filter(function (p) { return p.turmaId !== id; });
        if (D.cfg.turma === id) D.cfg.turma = (turmasDaEscola()[0] || {}).id || '';
        salva(); gerenciaTurmas(); barraEscopo(); render();
      }); break;
      case 'exportar-tudo': baixaJSON({ tipo: 'planejar-backup', versao: 1, data: new Date().toISOString(), dados: D }, 'planejar-copia-' + hojeISO() + '.json'); toast('Cópia salva.'); break;
      case 'importar-tudo': pedeArquivo(function (o) {
        var novo = o && (o.dados || (o.cfg ? o : null));
        if (!novo) { toast('Esse arquivo não é uma cópia do Planejar.'); return; }
        pergunta('Substituir tudo o que está neste aparelho pela cópia?', function () {
          D = novo; salva(); aplicaCfg(); fechaFolha(); barraEscopo(); render(); toast('Cópia restaurada.');
        }, 'Substituir');
      }); break;
      case 'limpar': pergunta('Isso apaga planos, anotações, listas e lembretes deste aparelho. Tem certeza?', function () {
        D = padrao(); salva(); aplicaCfg(); fechaFolha(); barraEscopo(); render(); toast('Tudo apagado.');
      }, 'Apagar tudo'); break;
    }
  });

  document.addEventListener('submit', function (ev) {
    var f = ev.target.closest('.add-item'); if (!f) return;
    ev.preventDefault();
    var l = byId(D.listas, f.dataset.id); var i = f.querySelector('input');
    if (i.value.trim()) { l.itens.push({ txt: i.value.trim(), feito: false }); salva(); render(); }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'q-plano') { filtroPlano = ev.target.value; var v = ev.target.value, pos = ev.target.selectionStart; render(); var n = $('#q-plano'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') fechaFolha(); });

  /* ---------- início ---------- */
  var iniciado = false;
  carrega(); aplicaCfg();
  document.addEventListener('DOMContentLoaded', iniciar);
  if (document.readyState !== 'loading') iniciar();
  function iniciar() {
    if (iniciado) return; iniciado = true;
    montaNav();
    irPara(ordem()[0]);
    agendaAvisos();
    setTimeout(checaAtrasados, 900);
    atalhoDaUrl();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) agendaAvisos(); });
  }

  /* atalhos do ícone do celular: ?acao=novo-plano */
  function atalhoDaUrl() {
    var m = (location.search || '').match(/acao=([a-z\-]+)/);
    if (!m) return;
    var acao = m[1];
    if (history.replaceState) history.replaceState(null, '', location.pathname);
    setTimeout(function () {
      if (acao === 'novo-plano') { if (!turmasDaEscola().length) return; editorPlano(null); }
      else if (acao === 'nova-nota') editorNota(null);
      else if (acao === 'novo-lembrete') editorLembrete(null);
      else if (acao === 'agenda') irPara('agenda');
    }, 260);
  }

  window.Planejar = { dados: function () { return D; }, salvar: salva, ir: irPara, aviso: toast };
})();

</script>
<script>

/* Instalação e atualização do app */
(function () {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nova = reg.installing;
        if (!nova) return;
        nova.addEventListener('statechange', function () {
          if (nova.state === 'installed' && navigator.serviceWorker.controller) {
            var aviso = window.Planejar && window.Planejar.aviso;
            if (aviso) aviso('Nova versão pronta.', 'Atualizar', function () {
              nova.postMessage('atualizar-agora');
            });
          }
        });
      });
    }).catch(function () { /* sem service worker: o app continua funcionando */ });

    var recarregou = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (recarregou) return;
      recarregou = true;
      location.reload();
    });
  });
})();

/* Convite para instalar na tela inicial */
(function () {
  var convite = null;
  window.addEventListener('beforeinstallprompt', function (ev) {
    ev.preventDefault();
    convite = ev;
    setTimeout(function () {
      var aviso = window.Planejar && window.Planejar.aviso;
      if (!convite || !aviso) return;
      aviso('Dá para instalar o Planejar no celular.', 'Instalar', function () {
        convite.prompt();
        convite = null;
      });
    }, 4000);
  });
  window.addEventListener('appinstalled', function () { convite = null; });
})();

</script>
</body>
</html>
